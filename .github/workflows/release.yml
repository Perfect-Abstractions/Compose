name: Release

on:
  workflow_dispatch:
    inputs:
      release_target:
        description: 'Packages to release'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - compose
          - compose-cli

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ignore_flag: ${{ steps.map.outputs.ignore_flag }}
      version_branch: ${{ steps.map.outputs.version_branch }}
    steps:
      - name: Map release target to flags
        id: map
        run: |
          case "${{ inputs.release_target }}" in
            all)
              echo "ignore_flag=" >> "$GITHUB_OUTPUT"
              echo "version_branch=main" >> "$GITHUB_OUTPUT"
              ;;
            compose)
              echo "ignore_flag=--ignore @perfect-abstractions/compose-cli" >> "$GITHUB_OUTPUT"
              echo "version_branch=main-compose" >> "$GITHUB_OUTPUT"
              ;;
            compose-cli)
              echo "ignore_flag=--ignore @perfect-abstractions/compose" >> "$GITHUB_OUTPUT"
              echo "version_branch=main-cli" >> "$GITHUB_OUTPUT"
              ;;
          esac

  quality-gates:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive

      - name: Install Foundry
        if: inputs.release_target == 'all' || inputs.release_target == 'compose'
        uses: foundry-rs/foundry-toolchain@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Library quality gates
        if: inputs.release_target == 'all' || inputs.release_target == 'compose'
        run: npm run compose@check && npm run compose@pack:check

      - name: CLI quality gates
        if: inputs.release_target == 'all' || inputs.release_target == 'compose-cli'
        run: npm run cli@build && npm run cli@check && npm run cli@pack:check

  version-packages:
    needs: [prepare, quality-gates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create or update version PR
        uses: changesets/action@v1
        with:
          version: npm run version-packages -- ${{ needs.prepare.outputs.ignore_flag }}
          commit: "chore(release): apply changesets and bump versions"
          title: "chore(release): bump npm versions & changelogs"
          branch: ${{ needs.prepare.outputs.version_branch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
