name: Release

on:
  workflow_dispatch:
    inputs:
      release_target:
        description: 'Packages to release'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - compose
          - compose-cli

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ignore_flag: ${{ steps.map.outputs.ignore_flag }}
      head_branch: ${{ steps.map.outputs.head_branch }}
    steps:
      - name: Map release target to flags
        id: map
        run: |
          case "${{ inputs.release_target }}" in
            all)
              echo "ignore_flag=" >> "$GITHUB_OUTPUT"
              echo "head_branch=changeset-release/main" >> "$GITHUB_OUTPUT"
              ;;
            compose)
              echo "ignore_flag=--ignore @perfect-abstractions/compose-cli" >> "$GITHUB_OUTPUT"
              echo "head_branch=changeset-release/main-compose" >> "$GITHUB_OUTPUT"
              ;;
            compose-cli)
              echo "ignore_flag=--ignore @perfect-abstractions/compose" >> "$GITHUB_OUTPUT"
              echo "head_branch=changeset-release/main-cli" >> "$GITHUB_OUTPUT"
              ;;
          esac

  quality-gates:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive

      - name: Install Foundry
        if: inputs.release_target == 'all' || inputs.release_target == 'compose'
        uses: foundry-rs/foundry-toolchain@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Library quality gates
        if: inputs.release_target == 'all' || inputs.release_target == 'compose'
        run: npm run compose@check && npm run compose@pack:check

      - name: CLI quality gates
        if: inputs.release_target == 'all' || inputs.release_target == 'compose-cli'
        run: npm run cli@build && npm run cli@check && npm run cli@pack:check

  version-packages:
    needs: [prepare, quality-gates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Version packages
        run: npm run version-packages -- ${{ needs.prepare.outputs.ignore_flag }}

      - name: Create or update version PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ needs.prepare.outputs.head_branch }}
          RELEASE_TARGET: ${{ inputs.release_target }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$HEAD_BRANCH"
          git add .
          git commit -m "chore(release): apply changesets and bump versions"
          git push origin "$HEAD_BRANCH" --force

          # Check if PR already exists for this branch
          EXISTING_PR=$(gh pr list --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number' || true)

          if [ -n "$EXISTING_PR" ]; then
            echo "Updating existing PR #$EXISTING_PR"
          else
            # Build PR body
            BODY="## Release: ${RELEASE_TARGET}"
            BODY="${BODY}\n\n"
            if [ "${RELEASE_TARGET}" = "all" ]; then
              BODY="${BODY}Releases both \`@perfect-abstractions/compose\` and \`@perfect-abstractions/compose-cli\`."
            elif [ "${RELEASE_TARGET}" = "compose" ]; then
              BODY="${BODY}Releases \`@perfect-abstractions/compose\` only. CLI changesets remain pending."
            else
              BODY="${BODY}Releases \`@perfect-abstractions/compose-cli\` only. Library changesets remain pending."
            fi
            BODY="${BODY}\n\nWhen merged, **Publish** will run automatically and publish packages whose versions are ahead of npm."

            if [ "${RELEASE_TARGET}" = "compose-cli" ]; then
              PR_TITLE="chore(release cli): bump npm versions & changelogs"
            elif [ "${RELEASE_TARGET}" = "compose" ]; then
              PR_TITLE="chore(release library): bump npm versions & changelogs"
            else
              PR_TITLE="chore(release): bump npm versions & changelogs"
            fi

            gh pr create \
              --title "$PR_TITLE" \
              --body "$(echo -e "$BODY")" \
              --base main \
              --head "$HEAD_BRANCH"
          fi
